<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Auditor – Quick Page Health Check</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    header p {
      color: var(--muted);
      margin-top: 0.35rem;
      font-size: 0.95rem;
    }
    main {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="url"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input[type="url"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    button {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      min-height: 1.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
    #report {
      display: none;
    }
    #report.visible { display: block; }
    .report-grid {
      display: grid;
      gap: 0.75rem;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .row:last-child { border-bottom: none; }
    .label {
      color: var(--muted);
      flex-shrink: 0;
    }
    .value {
      text-align: right;
      word-break: break-word;
      font-weight: 500;
    }
    .value.null { color: var(--muted); font-style: italic; }
    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>URL Auditor</h1>
    <p>Quick health check for any web page</p>
  </header>

  <main>
    <div class="card">
      <div class="input-row">
        <input type="url" id="urlInput" placeholder="https://example.com" autocomplete="off" />
        <button id="auditBtn">Audit</button>
      </div>
      <div class="status" id="status"></div>

      <div id="report">
        <div class="report-grid" id="reportBody"></div>
      </div>
    </div>
  </main>

  <footer>
    Built for <a href="https://digitalheroesco.com" target="_blank" rel="noopener">Digital Heroes Training Task</a>
  </footer>

  <script>
    const input = document.getElementById("urlInput");
    const btn = document.getElementById("auditBtn");
    const statusEl = document.getElementById("status");
    const reportEl = document.getElementById("report");
    const reportBody = document.getElementById("reportBody");

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    function formatValue(val) {
      if (val === null || val === undefined) return '<span class="value null">—</span>';
      return `<span class="value">${escapeHtml(String(val))}</span>`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderReport(data) {
      const rows = [
        ["URL", data.url],
        ["HTTP Status", data.http_status],
        ["Response Time", data.response_time_ms != null ? data.response_time_ms + " ms" : null],
        ["Page Title", data.title],
        ["Meta Description", data.meta_description],
        ["H1 Count", data.h1_count],
        ["Images Missing Alt", data.images_missing_alt],
        ["Approx. Word Count", data.word_count],
      ];

      reportBody.innerHTML = rows
        .map(([label, val]) => `
          <div class="row">
            <span class="label">${label}</span>
            ${formatValue(val)}
          </div>
        `)
        .join("");

      reportEl.classList.add("visible");
    }

    async function runAudit() {
      let url = input.value.trim();
      if (!url) {
        setStatus("Please enter a URL", "error");
        return;
      }
      // Auto-add https if missing scheme
      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
        input.value = url;
      }

      btn.disabled = true;
      setStatus('<span class="spinner"></span> Auditing…');
      reportEl.classList.remove("visible");

      try {
        const res = await fetch("/api/audit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (data.success) {
          setStatus("Audit complete", "success");
          renderReport(data);
        } else {
          setStatus(data.error || "Audit failed", "error");
          // Still show partial data if available
          if (data.http_status || data.response_time_ms) {
            renderReport(data);
          }
        }
      } catch (err) {
        setStatus("Network error – could not reach the server", "error");
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", runAudit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runAudit();
    });
  </script>
</body>
</html>
